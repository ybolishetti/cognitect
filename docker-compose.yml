version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - COGNITECT_CLAUDE_API_KEY=${COGNITECT_CLAUDE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - REDIS_URL=redis://redis:6379/0
      - FREECAD_APPIMAGE_PATH=/data/freecad/FreeCAD.AppImage
      - LOG_LEVEL=INFO
    volumes:
      - freecad_data:/data/freecad
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: celery -A api.tasks.pipeline worker --loglevel=info --concurrency=2
    environment:
      - COGNITECT_CLAUDE_API_KEY=${COGNITECT_CLAUDE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - FREECAD_APPIMAGE_PATH=/data/freecad/FreeCAD.AppImage
    volumes:
      - freecad_data:/data/freecad
    depends_on:
      - redis
    restart: unless-stopped

  # Kept for local dev parity / anything not yet migrated off Postgres —
  # the API and worker talk to Supabase (hosted Postgres) instead, not this
  # container. Nothing in api/ or engine/ currently connects to DATABASE_URL.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cognitect
      POSTGRES_PASSWORD: cognitect
      POSTGRES_DB: cognitect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitect"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  freecad_data:
