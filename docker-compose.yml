version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - COGNITECT_CLAUDE_API_KEY=${COGNITECT_CLAUDE_API_KEY}
      - DATABASE_URL=postgresql://cognitect:cognitect@postgres:5432/cognitect
      - REDIS_URL=redis://redis:6379/0
      - FREECAD_APPIMAGE_PATH=/data/freecad/FreeCAD.AppImage
      - LOG_LEVEL=INFO
    volumes:
      - freecad_data:/data/freecad
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: celery -A api.tasks.pipeline worker --loglevel=info --concurrency=2
    environment:
      - COGNITECT_CLAUDE_API_KEY=${COGNITECT_CLAUDE_API_KEY}
      - DATABASE_URL=postgresql://cognitect:cognitect@postgres:5432/cognitect
      - REDIS_URL=redis://redis:6379/0
      - FREECAD_APPIMAGE_PATH=/data/freecad/FreeCAD.AppImage
    volumes:
      - freecad_data:/data/freecad
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cognitect
      POSTGRES_PASSWORD: cognitect
      POSTGRES_DB: cognitect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitect"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  freecad_data:
